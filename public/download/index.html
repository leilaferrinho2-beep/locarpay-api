<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baixar iLocarPay</title>
  <meta property="og:title" content="📲 Baixe o app iLocarPay">
  <meta property="og:description" content="Acompanhe sua locação, pague o aluguel e abra chamados direto pelo app. Toque para baixar.">
  <meta property="og:image" content="https://www.ilocarpay.com.br/apple-touch-icon.png">
  <meta property="og:url" content="https://www.ilocarpay.com.br/download">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Acompanhe sua locação, pague o aluguel e abra chamados direto pelo app iLocarPay.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0a1a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a2a1a;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      margin: 0 auto 20px;
      background: #2E7D32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .sub { color: #aaa; font-size: 15px; margin-bottom: 32px; }
    .btn {
      display: block;
      background: #2E7D32;
      color: #fff;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1B5E20; }
    .btn span { display: block; font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 2px; }
    .info {
      margin-top: 28px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠</div>
    <h1>iLocarPay</h1>
    <p class="sub">Gestão inteligente de aluguéis</p>

    <a class="btn" id="apk-link" href="#">
      📲 Baixar app (Android)
      <span>Arquivo APK direto</span>
    </a>

    <p class="info">
      Após baixar, abra o arquivo APK no seu celular.<br>
      Se solicitado, permita a instalação de fontes desconhecidas.
    </p>
  </div>

  <script>
    // Busca a URL do APK mais recente do servidor
    fetch('/version.json')
      .then(r => r.json())
      .then(data => {
        if (data.url) {
          document.getElementById('apk-link').href = data.url;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
