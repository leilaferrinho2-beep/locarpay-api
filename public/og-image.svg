<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a2a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#81C784"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#4CAF50" opacity="0.04"/>
  <circle cx="150" cy="530" r="150" fill="#4CAF50" opacity="0.04"/>

  <!-- Green accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Logo mark (pin icon) -->
  <g transform="translate(100, 210)">
    <!-- Pin shape -->
    <ellipse cx="70" cy="62" rx="42" ry="42" fill="none" stroke="#4CAF50" stroke-width="6"/>
    <ellipse cx="70" cy="62" rx="20" ry="20" fill="#4CAF50"/>
    <line x1="70" y1="104" x2="70" y2="140" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
    <!-- Circle accent -->
    <circle cx="70" cy="62" r="55" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- iLocarPay wordmark -->
  <text x="240" y="285" font-family="Arial, sans-serif" font-weight="700" font-size="82" fill="white" letter-spacing="-2">iLocar<tspan fill="#4CAF50">Pay</tspan></text>

  <!-- Tagline -->
  <text x="240" y="340" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="#9E9E9E" letter-spacing="0.5">Gestão de Aluguéis para Imobiliárias</text>

  <!-- Divider -->
  <rect x="240" y="368" width="80" height="3" fill="url(#accent)" rx="2"/>

  <!-- Features -->
  <g transform="translate(240, 415)">
    <circle cx="8" cy="8" r="8" fill="#4CAF50" opacity="0.2"/>
    <circle cx="8" cy="8" r="4" fill="#4CAF50"/>
    <text x="28" y="13" font-family="Arial, sans-serif" font-size="22" fill="#E0E0E0">Cobranças automáticas</text>
  </g>
  <g transform="translate(240, 455)">
    <circle cx="8" cy="8" r="8" fill="#4CAF50" opacity="0.2"/>
    <circle cx="8" cy="8" r="4" fill="#4CAF50"/>
    <text x="28" y="13" font-family="Arial, sans-serif" font-size="22" fill="#E0E0E0">Contratos digitais</text>
  </g>
  <g transform="translate(240, 495)">
    <circle cx="8" cy="8" r="8" fill="#4CAF50" opacity="0.2"/>
    <circle cx="8" cy="8" r="4" fill="#4CAF50"/>
    <text x="28" y="13" font-family="Arial, sans-serif" font-size="22" fill="#E0E0E0">App para inquilinos e corretores</text>
  </g>

  <!-- Domain badge -->
  <rect x="830" y="490" width="280" height="52" rx="26" fill="#4CAF50" opacity="0.12"/>
  <rect x="830" y="490" width="280" height="52" rx="26" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.4"/>
  <text x="970" y="522" font-family="Arial, sans-serif" font-size="20" fill="#4CAF50" text-anchor="middle" font-weight="600">ilocarpay.com.br</text>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)" opacity="0.6"/>
</svg>
