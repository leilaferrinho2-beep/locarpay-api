<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background sólido verde escuro (sem gradiente = nítido no WhatsApp) -->
  <rect width="1200" height="630" fill="#0d1f0d"/>

  <!-- Borda verde sutil -->
  <rect x="0" y="0" width="1200" height="8" fill="#25a244"/>
  <rect x="0" y="622" width="1200" height="8" fill="#25a244"/>

  <!-- Logo mark centralizado verticalmente -->
  <g transform="translate(90, 175)">
    <!-- Círculo externo -->
    <circle cx="90" cy="90" r="80" fill="none" stroke="#25a244" stroke-width="8"/>
    <!-- Círculo interno preenchido -->
    <circle cx="90" cy="90" r="36" fill="#25a244"/>
    <!-- Haste do pin -->
    <rect x="83" y="168" width="14" height="52" rx="7" fill="#25a244"/>
    <!-- Ponta oval -->
    <ellipse cx="90" cy="226" rx="10" ry="6" fill="#25a244"/>
    <!-- Anel decorativo -->
    <circle cx="90" cy="90" r="100" fill="none" stroke="#25a244" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- iLocarPay wordmark -->
  <text x="280" y="305" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="-3">iLocar<tspan fill="#25a244">Pay</tspan></text>

  <!-- Tagline -->
  <text x="283" y="370" font-family="Arial, sans-serif" font-weight="400" font-size="32" fill="#7ab87a" letter-spacing="0.5">Gestão de Aluguéis para Imobiliárias</text>

  <!-- Linha separadora -->
  <rect x="283" y="400" width="100" height="4" fill="#25a244" rx="2"/>

  <!-- Features -->
  <g transform="translate(283, 440)">
    <circle cx="10" cy="10" r="10" fill="#25a244"/>
    <text x="32" y="16" font-family="Arial, sans-serif" font-size="26" fill="#c8e6c8">Cobranças automáticas</text>
  </g>
  <g transform="translate(283, 488)">
    <circle cx="10" cy="10" r="10" fill="#25a244"/>
    <text x="32" y="16" font-family="Arial, sans-serif" font-size="26" fill="#c8e6c8">Contratos digitais</text>
  </g>
  <g transform="translate(283, 536)">
    <circle cx="10" cy="10" r="10" fill="#25a244"/>
    <text x="32" y="16" font-family="Arial, sans-serif" font-size="26" fill="#c8e6c8">App para inquilinos e corretores</text>
  </g>

  <!-- URL badge -->
  <rect x="880" y="528" width="260" height="58" rx="29" fill="none" stroke="#25a244" stroke-width="3"/>
  <text x="1010" y="563" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#25a244" text-anchor="middle">ilocarpay.com.br</text>

</svg>
